<h1 class="mt-0 mb-4 text-2xl font-bold">Ajustes</h1>

<mat-card>
  <mat-card-content class="flex! items-center gap-4">
    <mat-icon aria-hidden="true" class="text-primary! h-8! w-8! text-[32px]! leading-none!">bolt</mat-icon>
    <div>
      <strong>QuickDev</strong>
      <p class="m-0 text-[0.85rem] text-outline">Versión 1.0.0</p>
    </div>
  </mat-card-content>
</mat-card>

<h2 class="mt-6 mb-2 text-base">Apariencia</h2>
<mat-card>
  <mat-card-content class="flex! items-center justify-between">
    <span>Tema oscuro</span>
    <mat-slide-toggle [checked]="themeService.isDark()" (change)="themeService.set($event.checked)" />
  </mat-card-content>
</mat-card>

<button mat-stroked-button color="warn" class="mt-6 w-full" (click)="logout()">
  <mat-icon aria-hidden="true">logout</mat-icon>
  Cerrar sesión
</button>
