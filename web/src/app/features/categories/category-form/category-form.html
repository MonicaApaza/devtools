<div class="form-sheet">
  <h2>{{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <p class="section-label">Disponible para</p>
  <mat-radio-group [value]="type()" (change)="type.set($event.value)" class="type-group">
    <mat-radio-button value="Shortcut">Shortcut</mat-radio-button>
    <mat-radio-button value="Command">Comando</mat-radio-button>
    <mat-radio-button value="Both">Ambos</mat-radio-button>
  </mat-radio-group>

  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput [formField]="textForm.name" />
    @if (textForm.name().touched() && textForm.name().errors().length) {
      <mat-error>{{ textForm.name().errors()[0].message }}</mat-error>
    }
  </mat-form-field>

  <p class="section-label">Ícono</p>
  <app-icon-picker [(selectedKey)]="icon" />

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  <div class="form-actions">
    <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="onSubmit()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Guardar
      }
    </button>
  </div>
</div>
