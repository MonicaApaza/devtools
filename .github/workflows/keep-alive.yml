name: Keep Render backend awake

on:
  schedule:
    # Cada 10 min, entre 13:00 UTC y 03:00 UTC del día siguiente
    # (9am-11pm hora Bolivia, UTC-4)
    - cron: '*/10 13-23,0-2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://devtools-api-4nu2.onrender.com/health
