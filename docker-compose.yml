services:
  postgres:
    image: postgres:16-alpine
    container_name: devtools_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devtools
      POSTGRES_USER: devtools
      POSTGRES_PASSWORD: devtools
    ports:
      - "5432:5432"
    volumes:
      - devtools_postgres_data:/var/lib/postgresql/data

volumes:
  devtools_postgres_data:
